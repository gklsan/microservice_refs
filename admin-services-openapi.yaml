openapi: 3.0.3
info:
  title: admin-services API
  version: 1.0.0
  description: |
    Admin user management and RBAC for DigiHire Phase 5.

    How to call it
    - Click "Authorize" and paste a JWT issued by auth-services (the `token` cookie value after login),
      or mint a local one with `scripts/dev-token.sh` (dev only).
    - `/internal/**` needs the `X-Internal-Key` header instead of a JWT. It is not routed by the gateway.
    - Pick the server: direct (port 8989) works from Swagger UI. Through the gateway the Swagger page itself is
      behind AuthFilter, so use the direct server locally.

    Rules
    - Reading users needs `USER:VIEW`, roles `ROLE:VIEW`, configuration `CONFIG:VIEW`. Every change needs an active SUPER_ADMIN plus `USER:MANAGE` / `ROLE:MANAGE` / `CONFIG:MANAGE`.
    - Nobody can change their own account. The last active Super Admin can not be removed.
    - Every error is RFC 7807 with a stable `code`. Branch on `code`, never on the text.
servers:
  - url: http://localhost:8989/admin-services
    description: Local, direct to the service
  - url: http://localhost:8980/admin-services
    description: Local, through gateway-services
  - url: https://uat-jobs.agshealth.com/api/admin-services
    description: UAT, through the gateway
security:
  - bearerAuth: []
tags:
  - name: Admin users
    description: Admin user account creation, list / search, deactivate / reactivate, roles, granular permissions
  - name: Roles and permission matrix
  - name: Enterprise configuration
    description: Tracker #32 - only an active SUPER_ADMIN changes enterprise-level settings
  - name: RBAC for the logged-in user
  - name: Internal (service to service)

paths:
  # ------------------------------------------------------------------ admin users
  /admin/users:
    post:
      tags: [Admin users]
      summary: Create an admin user
      description: |
        Rule: `hasRole('SUPER_ADMIN') and hasAuthority('USER:MANAGE')`.
        Creates the authorisation record only. The person logs in through auth-services / Azure AD as today
        and is matched on e-mail (`loginLinked` turns true after their first request).
        CANDIDATE and VENDOR roles can not be given here.
      operationId: createAdminUser
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateAdminUserRequest' }
            examples:
              recruiter:
                summary: Recruiter (sees own records)
                value:
                  email: priya.r@agshealth.com
                  fullName: Priya Raman
                  employeeCode: AGS10234
                  userType: EMPLOYEE_HR
                  roles: [RECRUITER]
                  managerId: 9a8b7c6d-5e4f-4a3b-8c2d-1e0f9a8b7c6d
              teamLead:
                summary: TL = Recruitment Manager with TEAM visibility
                value:
                  email: karthik.s@agshealth.com
                  fullName: Karthik Subramanian
                  employeeCode: AGS10011
                  userType: EMPLOYEE_HR
                  roles: [RECRUITMENT_MANAGER]
                  scopeLevel: TEAM
              manager:
                summary: Manager = Recruitment Manager with LOB visibility
                value:
                  email: divya.m@agshealth.com
                  fullName: Divya Mohan
                  userType: EMPLOYEE_HR
                  roles: [RECRUITMENT_MANAGER]
                  scopeLevel: LOB
                  lobs: [VOICE, NON_VOICE]
                  locations: [CHENNAI]
              panelMember:
                summary: Panel member = Employee + Interviewer
                value:
                  email: arun.k@agshealth.com
                  fullName: Arun Kumar
                  userType: EMPLOYEE_NON_HR
                  roles: [EMPLOYEE, INTERVIEWER]
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminUserResponse' }
              examples:
                priya: { $ref: '#/components/examples/AdminUserPriya' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: E-mail already used
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              example:
                type: about:blank
                title: Conflict
                status: 409
                detail: A user with e-mail priya.r@agshealth.com already exists (id 3f9d2b10-8a4c-4e5f-b7d2-61c0e8a4f2b3, status ACTIVE)
                code: USER_EXISTS
                correlationId: 5d0c6c9e-2f0e-4c1f-9b7e-3c9a1f6d2e10
    get:
      tags: [Admin users]
      summary: List / search admin users
      description: "Rule: `hasAuthority('USER:VIEW')`. Search matches name, e-mail and employee code (case-insensitive)."
      operationId: searchAdminUsers
      parameters:
        - { name: search, in: query, schema: { type: string }, example: priya }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/UserStatus' } }
        - { name: role, in: query, schema: { type: string }, example: RECRUITER }
        - { name: page, in: query, schema: { type: integer, default: 0, minimum: 0 } }
        - { name: size, in: query, schema: { type: integer, default: 20, minimum: 1, maximum: 100 } }
        - { name: sort, in: query, schema: { type: string, enum: [fullName, email, status, updatedDate], default: fullName } }
        - { name: direction, in: query, schema: { type: string, enum: [ASC, DESC], default: ASC } }
      responses:
        '200':
          description: One page of users
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminUserPage' }
              example:
                content:
                  - id: 3f9d2b10-8a4c-4e5f-b7d2-61c0e8a4f2b3
                    email: priya.r@agshealth.com
                    fullName: Priya Raman
                    employeeCode: AGS10234
                    status: ACTIVE
                    roles: [RECRUITER]
                    grantCount: 2
                    loginLinked: true
                    updatedDate: '2026-09-30T09:12:44.512Z'
                page: 0
                size: 20
                totalElements: 1
                totalPages: 1
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/users/{id}:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      tags: [Admin users]
      summary: Get one admin user
      description: "Rule: `hasAuthority('USER:VIEW')`"
      operationId: getAdminUser
      responses:
        '200':
          description: The user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminUserResponse' }
              examples:
                priya: { $ref: '#/components/examples/AdminUserPriya' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Admin users]
      summary: Update profile, manager and data scope
      description: |
        Rule: `hasRole('SUPER_ADMIN') and hasAuthority('USER:MANAGE')`. E-mail can not change.
        Send the `version` you loaded to get a 409 instead of overwriting another admin's edit.
      operationId: updateAdminUser
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateAdminUserRequest' }
            example:
              fullName: Priya Raman
              employeeCode: AGS10234
              managerId: 9a8b7c6d-5e4f-4a3b-8c2d-1e0f9a8b7c6d
              scopeLevel: LOB
              lobs: [VOICE]
              locations: []
              version: 3
      responses:
        '200':
          description: Updated user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminUserResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/SelfOrForbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Stale' }

  /admin/users/{id}/deactivate:
    parameters:
      - $ref: '#/components/parameters/UserId'
    patch:
      tags: [Admin users]
      summary: Deactivate a user (reason required)
      description: |
        Rule: `hasRole('SUPER_ADMIN') and hasAuthority('USER:MANAGE')`.
        The login stays valid, but the user has no role and no permission from the next request.
        Idempotent. Fails with LAST_SUPER_ADMIN for the last active Super Admin.
      operationId: deactivateAdminUser
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StatusChangeRequest' }
            example: { reason: Moved to the Finance team on 30-Sep-2026 }
      responses:
        '200':
          description: User is INACTIVE
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminUserResponse' }
              example:
                id: 3f9d2b10-8a4c-4e5f-b7d2-61c0e8a4f2b3
                email: priya.r@agshealth.com
                fullName: Priya Raman
                userType: EMPLOYEE_HR
                status: INACTIVE
                roles: [{ code: RECRUITER, name: Recruiter, active: true }]
                effectiveScopeLevel: OWN
                lobs: []
                locations: []
                permissionGrants: []
                loginLinked: true
                statusChangedDate: '2026-09-30T10:02:11.004Z'
                statusChangedBy: first.admin@agshealth.com
                statusReason: Moved to the Finance team on 30-Sep-2026
                createdDate: '2026-09-01T05:30:00Z'
                createdBy: first.admin@agshealth.com
                version: 4
        '400':
          description: Reason missing
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              example: { title: Bad Request, status: 400, detail: Give a reason for deactivating the user, code: REASON_REQUIRED }
        '403': { $ref: '#/components/responses/SelfOrForbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/LastSuperAdmin' }

  /admin/users/{id}/reactivate:
    parameters:
      - $ref: '#/components/parameters/UserId'
    patch:
      tags: [Admin users]
      summary: Reactivate a user
      description: "Rule: `hasRole('SUPER_ADMIN') and hasAuthority('USER:MANAGE')`. Body optional. Idempotent."
      operationId: reactivateAdminUser
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StatusChangeRequest' }
            example: { reason: Back from long leave }
      responses:
        '200':
          description: User is ACTIVE
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminUserResponse' }
        '403': { $ref: '#/components/responses/SelfOrForbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/users/{id}/roles:
    parameters:
      - $ref: '#/components/parameters/UserId'
    put:
      tags: [Admin users]
      summary: Replace the user's roles
      description: |
        Rule: `hasRole('SUPER_ADMIN') and hasAuthority('USER:MANAGE')`.
        Full replace, idempotent. To revoke a role, leave it out.
      operationId: assignAdminUserRoles
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AssignRolesRequest' }
            example: { roles: [EMPLOYEE, INTERVIEWER] }
      responses:
        '200':
          description: Updated user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminUserResponse' }
        '400':
          description: UNKNOWN_ROLE, ROLE_INACTIVE or ROLE_NOT_ASSIGNABLE
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              example:
                title: Bad Request
                status: 400
                detail: Role(s) [CANDIDATE] are given by registration / vendor onboarding, not from the admin user screen
                code: ROLE_NOT_ASSIGNABLE
        '403': { $ref: '#/components/responses/SelfOrForbidden' }
        '409': { $ref: '#/components/responses/LastSuperAdmin' }

  /admin/users/{id}/permissions:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      tags: [Admin users]
      summary: User-level permission grants
      description: "Rule: `hasAuthority('USER:VIEW')`"
      operationId: getAdminUserPermissions
      responses:
        '200':
          description: Grants
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/GrantView' }
              example:
                - permission: OFFER:VIEW
                  effect: ALLOW
                  conditional: true
                  expiresAt: '2026-10-31T18:29:59Z'
                  expired: false
                  reason: Covering for Karthik during October
                  grantedBy: first.admin@agshealth.com
                  grantedDate: '2026-09-30T09:12:44.512Z'
                - permission: REPORT:VIEW
                  effect: DENY
                  conditional: false
                  expired: false
                  reason: Contractor - no report access
                  grantedBy: first.admin@agshealth.com
                  grantedDate: '2026-09-30T09:12:44.512Z'
    put:
      tags: [Admin users]
      summary: Replace the user's granular permissions
      description: |
        Rule: `hasRole('SUPER_ADMIN') and hasAuthority('USER:MANAGE')`.
        Full replace; an empty list removes every override. DENY always wins over roles and ALLOW.
        `conditional: true` (ALLOW only) = valid only on records the user owns or is assigned to.
        Privileged permissions (USER:MANAGE, ROLE:MANAGE, CONFIG:MANAGE, INTEGRATION:CREATE / UPDATE) can not be granted here.
      operationId: setAdminUserPermissions
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserPermissionGrantRequest' }
            example:
              grants:
                - permission: OFFER:VIEW
                  effect: ALLOW
                  conditional: true
                  expiresAt: '2026-10-31T18:29:59Z'
                  reason: Covering for Karthik during October
                - permission: REPORT:VIEW
                  effect: DENY
                  reason: Contractor - no report access
      responses:
        '200':
          description: Updated user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminUserResponse' }
        '400':
          description: UNKNOWN_PERMISSION, PRIVILEGED_PERMISSION, DUPLICATE_PERMISSION, INVALID_GRANT or VALIDATION_FAILED
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              example:
                title: Bad Request
                status: 400
                detail: Permission(s) [USER:MANAGE] can only be given through the SUPER_ADMIN role, not as a user-level grant
                code: PRIVILEGED_PERMISSION
        '403': { $ref: '#/components/responses/SelfOrForbidden' }

  /admin/users/{id}/effective-access:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      tags: [Admin users]
      summary: Why can this user do X? (every permission with its sources)
      description: "Rule: `hasAuthority('USER:VIEW')`. state = GRANTED, CONDITIONAL or DENIED."
      operationId: getAdminUserEffectiveAccess
      responses:
        '200':
          description: Effective access with sources
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EffectiveAccessDetail' }
              example:
                access:
                  userId: c0a8012e-91f1-4b35-8a6e-2d5f0b1c7a44
                  adminUserId: 3f9d2b10-8a4c-4e5f-b7d2-61c0e8a4f2b3
                  email: priya.r@agshealth.com
                  active: true
                  configured: true
                  roles: [RECRUITER]
                  permissions: [JOB:VIEW, CANDIDATE:VIEW, CANDIDATE:DELETE, OFFER:VIEW]
                  conditionalPermissions: [CANDIDATE:DELETE, OFFER:VIEW]
                  scope: { level: OWN, userId: c0a8012e-91f1-4b35-8a6e-2d5f0b1c7a44, teamUserIds: [], lobs: [], locations: [], sharedObjects: {} }
                lines:
                  - { permission: JOB:VIEW, module: Jobs / requisitions, state: GRANTED, sources: [ROLE RECRUITER] }
                  - { permission: CANDIDATE:DELETE, module: Candidates, state: CONDITIONAL, sources: [ROLE RECRUITER (C)] }
                  - { permission: OFFER:VIEW, module: Offers, state: CONDITIONAL, sources: [USER ALLOW (C)] }
                  - { permission: REPORT:VIEW, module: Reports, state: DENIED, sources: [ROLE RECRUITER, USER DENY] }
        '404': { $ref: '#/components/responses/NotFound' }

  # ------------------------------------------------------------------ roles and matrix
  /admin/roles:
    get:
      tags: [Roles and permission matrix]
      summary: List roles (with active user count)
      description: "Rule: `hasAuthority('ROLE:VIEW')`"
      operationId: listRoles
      parameters:
        - { name: includeInactive, in: query, schema: { type: boolean, default: true } }
      responses:
        '200':
          description: Roles
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/RoleView' }
              example:
                - id: 0b6f3a2e-1c4d-4e5f-8a9b-7c6d5e4f3a2b
                  code: RECRUITER
                  legacyCode: R02
                  name: Recruiter
                  description: Owns requisition work for assigned records.
                  defaultScope: OWN
                  systemRole: true
                  active: true
                  activeUserCount: 42
                  permissions:
                    - { code: CANDIDATE:DELETE, conditional: true }
                    - { code: CANDIDATE:VIEW, conditional: false }
                  version: 0
    post:
      tags: [Roles and permission matrix]
      summary: Create a role
      description: "Rule: `hasRole('SUPER_ADMIN') and hasAuthority('ROLE:MANAGE')`. Codes INTERNAL and SYSTEM are reserved."
      operationId: createRole
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateRoleRequest' }
            example:
              code: OFFER_APPROVER
              name: Offer Approver
              description: Approves compensation and offer exceptions (role catalog R09)
              defaultScope: LOB
              permissions:
                - { code: OFFER_APPROVAL_QUEUE:VIEW, conditional: false }
                - { code: SELECTION_OFFER:VIEW, conditional: false }
                - { code: SELECTION_OFFER:UPDATE, conditional: true }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoleView' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409':
          description: Role exists
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              example: { title: Conflict, status: 409, detail: 'Role already exists: OFFER_APPROVER', code: ROLE_EXISTS }

  /admin/roles/{code}:
    parameters:
      - $ref: '#/components/parameters/RoleCode'
    get:
      tags: [Roles and permission matrix]
      summary: Get a role
      operationId: getRole
      responses:
        '200':
          description: Role
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoleView' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Roles and permission matrix]
      summary: Edit or retire a role
      description: |
        Rule: `hasRole('SUPER_ADMIN') and hasAuthority('ROLE:MANAGE')`.
        `active: false` retires the role (it stops granting anything on the next request). SUPER_ADMIN can not be retired.
        `permissions` omitted = keep current set.
      operationId: updateRole
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateRoleRequest' }
            example:
              name: Recruiter
              description: Owns requisition work for assigned records.
              defaultScope: OWN
              active: true
              version: 0
      responses:
        '200':
          description: Updated role
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoleView' }
        '400':
          description: SUPER_ADMIN_ROLE_LOCKED, PRIVILEGED_PERMISSION, UNKNOWN_PERMISSION
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              example: { title: Bad Request, status: 400, detail: The SUPER_ADMIN role can not be retired, code: SUPER_ADMIN_ROLE_LOCKED }
        '409': { $ref: '#/components/responses/Stale' }

  /admin/roles/{code}/reset-defaults:
    parameters:
      - $ref: '#/components/parameters/RoleCode'
    post:
      tags: [Roles and permission matrix]
      summary: Restore a role to the access-matrix defaults
      operationId: resetRoleDefaults
      responses:
        '200':
          description: Role with default permissions
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoleView' }
        '400':
          description: No defaults (custom role)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              example: { title: Bad Request, status: 400, detail: Role OFFER_APPROVER has no factory default permission set, code: NO_DEFAULTS }

  /admin/permissions:
    get:
      tags: [Roles and permission matrix]
      summary: Permission catalogue (read-only, seeded)
      operationId: listPermissions
      responses:
        '200':
          description: Catalogue in matrix order
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PermissionView' }
              example:
                - { code: USER:VIEW, objectType: USER, action: VIEW, module: Users, description: View admin users and their access, privileged: false }
                - { code: USER:MANAGE, objectType: USER, action: MANAGE, module: Users, description: 'Create, update, deactivate / reactivate users, assign roles and user permissions', privileged: true }
                - { code: APPLICATION:REJECT, objectType: APPLICATION, action: REJECT, module: Applications / pipeline, description: Reject application, privileged: false }

  /admin/permission-matrix:
    get:
      tags: [Roles and permission matrix]
      summary: Role x permission grid
      description: grants = roleCode -> (permissionCode -> "A" or "C"). Missing = not granted.
      operationId: getPermissionMatrix
      responses:
        '200':
          description: Matrix
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Matrix' }
              example:
                roles: []
                permissions: []
                grants:
                  RECRUITER: { 'CANDIDATE:VIEW': A, 'CANDIDATE:DELETE': C }
                  INTERVIEWER: { 'INTERVIEW:VIEW': C, 'INTERVIEW:UPDATE': C }
    put:
      tags: [Roles and permission matrix]
      summary: Save the matrix (only roles in the body change)
      description: "Rule: `hasRole('SUPER_ADMIN') and hasAuthority('ROLE:MANAGE')`. Each listed role gets exactly the listed permissions."
      operationId: savePermissionMatrix
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MatrixUpdate' }
            example:
              grants:
                RECRUITMENT_MANAGER:
                  - { code: JOB:VIEW, conditional: false }
                  - { code: CANDIDATE:VIEW, conditional: false }
                  - { code: CANDIDATE:UPDATE, conditional: false }
                  - { code: CANDIDATE:DELETE, conditional: true }
                  - { code: INTERVIEW:VIEW, conditional: false }
      responses:
        '200':
          description: Matrix after save
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Matrix' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /admin/permission-matrix/defaults:
    get:
      tags: [Roles and permission matrix]
      summary: Factory default permission sets per role (tracker #1-3), optionally for one object
      operationId: getMatrixDefaults
      parameters:
        - { name: objectType, in: query, schema: { type: string, enum: [JOB, CANDIDATE, APPLICATION, INTERVIEW, WORKFLOW] }, example: JOB }
      responses:
        '200':
          description: roleCode -> permissions
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: array
                  items: { $ref: '#/components/schemas/PermissionItem' }
              example:
                RECRUITER:
                  - { code: JOB:MAP, conditional: false }
                  - { code: JOB:VIEW, conditional: false }
                RECRUITMENT_MANAGER:
                  - { code: JOB:CREATE, conditional: false }
                  - { code: JOB:DELETE, conditional: true }
                  - { code: JOB:PUBLISH, conditional: false }

  # ------------------------------------------------------------------ enterprise configuration (#32)
  /admin/config:
    get:
      tags: [Enterprise configuration]
      summary: List settings (optionally one category)
      description: "Rule: `hasAuthority('CONFIG:VIEW')`"
      operationId: listConfig
      parameters:
        - { name: category, in: query, schema: { type: string }, example: ASSESSMENT }
      responses:
        '200':
          description: Settings
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ConfigView' }
              example:
                - key: assessment.cooling-days.shl
                  value: '[7,30,180]'
                  valueType: LIST
                  category: ASSESSMENT
                  description: SHL cooling periods per attempt (BRD 4.8, sign-off DEP-S2-10)
                  updatedDate: '2026-09-30T09:12:44.512Z'
                  updatedBy: db-seed
                  version: 0
                - key: assessment.score-validity-days
                  value: '60'
                  valueType: NUMBER
                  category: ASSESSMENT
                  description: Assessment scores older than this push the candidate to Fresher Pipeline (BRD 4.7)
                  updatedDate: '2026-09-30T09:12:44.512Z'
                  updatedBy: db-seed
                  version: 0
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Enterprise configuration]
      summary: Create a setting
      description: |
        Rule: `hasRole('SUPER_ADMIN') and hasAuthority('CONFIG:MANAGE')`.
        Keys that look like credentials (password, secret, token, api-key ...) are refused: they belong in the S2 secret store.
      operationId: createConfig
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConfigCreate' }
            example:
              key: interview.walk-in.max-per-day
              value: '150'
              valueType: NUMBER
              category: INTERVIEW
              description: Walk-in slots per day per location
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConfigView' }
        '400':
          description: VALIDATION_FAILED, INVALID_CONFIG_VALUE or USE_SECRET_STORE
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              example: { title: Bad Request, status: 400, detail: Credentials and keys are not stored as enterprise configuration. Use the secret store., code: USE_SECRET_STORE }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: Key exists
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              example: { title: Conflict, status: 409, detail: 'Configuration already exists: interview.walk-in.max-per-day', code: CONFIG_EXISTS }
  /admin/config/{key}:
    parameters:
      - { name: key, in: path, required: true, schema: { type: string }, example: assessment.cooling-days.shl }
    get:
      tags: [Enterprise configuration]
      summary: Get one setting
      operationId: getConfig
      responses:
        '200':
          description: Setting
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConfigView' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Enterprise configuration]
      summary: Change a setting (value is type-checked)
      description: "Rule: `hasRole('SUPER_ADMIN') and hasAuthority('CONFIG:MANAGE')`. Audited with before / after."
      operationId: updateConfig
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConfigUpdate' }
            example: { value: '[7,30,180]', description: SHL cooling periods per attempt, version: 0 }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConfigView' }
        '400':
          description: Value does not match the type
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              example: { title: Bad Request, status: 400, detail: 'Value is not a valid LIST: expected a JSON array, e.g. [7,30,180]', code: INVALID_CONFIG_VALUE }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Stale' }

  # ------------------------------------------------------------------ rbac for UI
  /rbac/me:
    get:
      tags: [RBAC for the logged-in user]
      summary: What can I do? (call once after login)
      operationId: rbacMe
      responses:
        '200':
          description: Roles, permissions and data scope of the caller
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
              example:
                userId: 5b2c7d1e-0f3a-4b6c-9d8e-7f1a2b3c4d5e
                email: first.admin@agshealth.com
                name: First Admin
                userType: EMPLOYEE_HR_ADMIN
                active: true
                configured: true
                roles: [SUPER_ADMIN]
                permissions: [USER:VIEW, USER:MANAGE, ROLE:VIEW, ROLE:MANAGE, CONFIG:VIEW, CONFIG:MANAGE, AUDIT_LOG:VIEW, CANDIDATE:VIEW]
                conditionalPermissions: [CANDIDATE:VIEW]
                scope: { level: ALL, userId: 5b2c7d1e-0f3a-4b6c-9d8e-7f1a2b3c4d5e, teamUserIds: [], lobs: [], locations: [], sharedObjects: {} }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /rbac/check:
    post:
      tags: [RBAC for the logged-in user]
      summary: May I do PERMISSION on this record?
      description: Applies conditional (owner / assignee only) and data scope rules.
      operationId: rbacCheck
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CheckRequest' }
            example:
              permission: INTERVIEW:UPDATE
              objectType: INTERVIEW
              objectId: 8e7d6c5b-4a39-4281-9f0e-1d2c3b4a5968
              ownerId: c0a8012e-91f1-4b35-8a6e-2d5f0b1c7a44
              assigneeIds: [5b2c7d1e-0f3a-4b6c-9d8e-7f1a2b3c4d5e]
              lob: VOICE
              location: CHENNAI
      responses:
        '200':
          description: Decision
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CheckResponse' }
              examples:
                allowed: { value: { allowed: true, reason: CONDITION_OWNER_OR_ASSIGNEE } }
                denied: { value: { allowed: false, reason: CONDITION_NOT_MET } }

  # ------------------------------------------------------------------ internal
  /internal/rbac/effective:
    get:
      tags: [Internal (service to service)]
      summary: Effective access of any user (other services cache it 2 minutes)
      security:
        - internalKey: []
      operationId: internalEffectiveAccess
      parameters:
        - { name: userId, in: query, schema: { type: string }, example: c0a8012e-91f1-4b35-8a6e-2d5f0b1c7a44 }
        - { name: email, in: query, schema: { type: string }, example: priya.r@agshealth.com }
        - { name: userType, in: query, schema: { type: string }, example: EMPLOYEE_HR }
      responses:
        '200':
          description: Effective access
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EffectiveAccess' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /internal/users/by-role/{roleCode}:
    get:
      tags: [Internal (service to service)]
      summary: Active users holding a role (e.g. e-mail recipients)
      security:
        - internalKey: []
      operationId: internalUsersByRole
      parameters:
        - { name: roleCode, in: path, required: true, schema: { type: string }, example: RECRUITMENT_MANAGER }
      responses:
        '200':
          description: Users
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AdminUserSummary' }

  /internal/config:
    get:
      tags: [Internal (service to service)]
      summary: Enterprise configuration for other services
      security:
        - internalKey: []
      operationId: internalConfigList
      parameters:
        - { name: category, in: query, schema: { type: string }, example: ASSESSMENT }
      responses:
        '200':
          description: Settings
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ConfigView' }
  /internal/config/{key}:
    get:
      tags: [Internal (service to service)]
      summary: One setting for other services
      security:
        - internalKey: []
      operationId: internalConfigGet
      parameters:
        - { name: key, in: path, required: true, schema: { type: string }, example: panel.orc-reapply-block-days }
      responses:
        '200':
          description: Setting
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConfigView' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT issued by auth-services (claims userId, email, userType, userName). HS256.
    internalKey:
      type: apiKey
      in: header
      name: X-Internal-Key

  parameters:
    UserId:
      name: id
      in: path
      required: true
      description: adm_app_user.id (not the smartie user id)
      schema: { type: string, format: uuid }
      example: 3f9d2b10-8a4c-4e5f-b7d2-61c0e8a4f2b3
    RoleCode:
      name: code
      in: path
      required: true
      schema: { type: string }
      example: RECRUITER

  examples:
    AdminUserPriya:
      value:
        id: 3f9d2b10-8a4c-4e5f-b7d2-61c0e8a4f2b3
        smartieUserId: c0a8012e-91f1-4b35-8a6e-2d5f0b1c7a44
        email: priya.r@agshealth.com
        fullName: Priya Raman
        employeeCode: AGS10234
        userType: EMPLOYEE_HR
        status: ACTIVE
        roles: [{ code: RECRUITER, name: Recruiter, active: true }]
        effectiveScopeLevel: OWN
        lobs: []
        locations: []
        managerId: 9a8b7c6d-5e4f-4a3b-8c2d-1e0f9a8b7c6d
        managerName: Karthik Subramanian
        permissionGrants: []
        loginLinked: true
        createdDate: '2026-09-30T09:12:44.512Z'
        createdBy: first.admin@agshealth.com
        updatedDate: '2026-09-30T09:12:44.512Z'
        updatedBy: first.admin@agshealth.com
        version: 0

  responses:
    BadRequest:
      description: Validation or business rule failed
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: about:blank
            title: Bad Request
            status: 400
            detail: Request has invalid fields
            code: VALIDATION_FAILED
            correlationId: 5d0c6c9e-2f0e-4c1f-9b7e-3c9a1f6d2e10
            errors:
              - { field: email, message: must be a well-formed email address }
    Unauthorized:
      description: No token, or token invalid / expired
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example: { title: Unauthorized, status: 401, detail: Session expired or token invalid, code: INVALID_TOKEN }
    Forbidden:
      description: Missing role or permission
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example: { title: Forbidden, status: 403, detail: You do not have permission for this action, code: ACCESS_DENIED }
    SelfOrForbidden:
      description: ACCESS_DENIED, or SELF_MODIFICATION_NOT_ALLOWED when the target is the caller
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example: { title: Forbidden, status: 403, detail: You can not change your own account. Ask another Super Admin., code: SELF_MODIFICATION_NOT_ALLOWED }
    NotFound:
      description: Not found
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example: { title: Not Found, status: 404, detail: 'User not found: 3f9d2b10-8a4c-4e5f-b7d2-61c0e8a4f2b3', code: NOT_FOUND }
    Stale:
      description: Someone else saved first
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example: { title: Conflict, status: 409, detail: Someone else changed this record. Reload and try again., code: CONCURRENT_MODIFICATION }
    LastSuperAdmin:
      description: Would leave the system without an active Super Admin
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example: { title: Conflict, status: 409, detail: This is the last active Super Admin. Add another Super Admin first., code: LAST_SUPER_ADMIN }

  schemas:
    UserStatus: { type: string, enum: [ACTIVE, INACTIVE] }
    ScopeLevel:
      type: string
      enum: [NONE, OWN, TEAM, LOB, LOCATION, ALL]
      description: OWN = own / assigned records, TEAM = + reports, LOB / LOCATION = + those values, ALL = everything
    UserType: { type: string, enum: [EMPLOYEE_HR, EMPLOYEE_HR_ADMIN, EMPLOYEE_NON_HR] }
    Effect: { type: string, enum: [ALLOW, DENY] }

    Problem:
      type: object
      description: RFC 7807 body. Branch on code.
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        code:
          type: string
          enum: [VALIDATION_FAILED, UNAUTHORIZED, INVALID_TOKEN, ACCESS_DENIED, NOT_FOUND, USER_EXISTS, SELF_MODIFICATION_NOT_ALLOWED,
                 LAST_SUPER_ADMIN, SUPER_ADMIN_ROLE_LOCKED, PRIVILEGED_PERMISSION, UNKNOWN_PERMISSION, UNKNOWN_ROLE, ROLE_INACTIVE,
                 ROLE_NOT_ASSIGNABLE, ROLE_EXISTS, RESERVED_ROLE, NO_DEFAULTS, INVALID_MANAGER, SCOPE_VALUES_REQUIRED, REASON_REQUIRED,
                 DUPLICATE_PERMISSION, INVALID_GRANT, CONCURRENT_MODIFICATION, EMAIL_DOMAIN_NOT_ALLOWED, INVALID_SORT, DATA_CONFLICT,
                 REQUEST_ERROR, NOT_A_USER, INTERNAL_ERROR, CONFIG_EXISTS, INVALID_CONFIG_VALUE, USE_SECRET_STORE]
        correlationId: { type: string }
        errors:
          type: array
          items:
            type: object
            properties:
              field: { type: string }
              message: { type: string }

    CreateAdminUserRequest:
      type: object
      required: [email, fullName, userType, roles]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        fullName: { type: string, maxLength: 200 }
        employeeCode: { type: string, maxLength: 50 }
        userType: { $ref: '#/components/schemas/UserType' }
        roles: { type: array, uniqueItems: true, minItems: 1, maxItems: 10, items: { type: string } }
        managerId: { type: string, format: uuid }
        scopeLevel: { $ref: '#/components/schemas/ScopeLevel' }
        lobs: { type: array, uniqueItems: true, items: { type: string, maxLength: 100 }, description: 'Required when scopeLevel = LOB' }
        locations: { type: array, uniqueItems: true, items: { type: string, maxLength: 100 }, description: 'Required when scopeLevel = LOCATION' }
    UpdateAdminUserRequest:
      type: object
      required: [fullName]
      properties:
        fullName: { type: string, maxLength: 200 }
        employeeCode: { type: string, maxLength: 50 }
        managerId: { type: string, format: uuid }
        scopeLevel: { $ref: '#/components/schemas/ScopeLevel' }
        lobs: { type: array, uniqueItems: true, items: { type: string } }
        locations: { type: array, uniqueItems: true, items: { type: string } }
        version: { type: integer, format: int64, description: 'Optimistic lock - send what you loaded' }
    StatusChangeRequest:
      type: object
      properties:
        reason: { type: string, maxLength: 1000 }
    AssignRolesRequest:
      type: object
      required: [roles]
      properties:
        roles: { type: array, uniqueItems: true, minItems: 1, maxItems: 10, items: { type: string } }
    GrantItem:
      type: object
      required: [permission, effect]
      properties:
        permission: { type: string, example: 'OFFER:VIEW' }
        effect: { $ref: '#/components/schemas/Effect' }
        conditional: { type: boolean, default: false, description: 'ALLOW only. Owner / assignee records only.' }
        expiresAt: { type: string, format: date-time, description: 'Must be in the future. Null = no expiry.' }
        reason: { type: string, maxLength: 500 }
    UserPermissionGrantRequest:
      type: object
      required: [grants]
      properties:
        grants: { type: array, maxItems: 200, items: { $ref: '#/components/schemas/GrantItem' } }
    RoleRef:
      type: object
      properties:
        code: { type: string }
        name: { type: string }
        active: { type: boolean }
    GrantView:
      type: object
      properties:
        permission: { type: string }
        effect: { $ref: '#/components/schemas/Effect' }
        conditional: { type: boolean }
        expiresAt: { type: string, format: date-time }
        expired: { type: boolean }
        reason: { type: string }
        grantedBy: { type: string }
        grantedDate: { type: string, format: date-time }
    AdminUserResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        smartieUserId: { type: string, description: 'Filled after the user''s first request' }
        email: { type: string }
        fullName: { type: string }
        employeeCode: { type: string }
        userType: { type: string }
        status: { $ref: '#/components/schemas/UserStatus' }
        roles: { type: array, items: { $ref: '#/components/schemas/RoleRef' } }
        scopeLevel: { $ref: '#/components/schemas/ScopeLevel' }
        effectiveScopeLevel: { $ref: '#/components/schemas/ScopeLevel' }
        lobs: { type: array, items: { type: string } }
        locations: { type: array, items: { type: string } }
        managerId: { type: string, format: uuid }
        managerName: { type: string }
        permissionGrants: { type: array, items: { $ref: '#/components/schemas/GrantView' } }
        loginLinked: { type: boolean }
        statusChangedDate: { type: string, format: date-time }
        statusChangedBy: { type: string }
        statusReason: { type: string }
        createdDate: { type: string, format: date-time }
        createdBy: { type: string }
        updatedDate: { type: string, format: date-time }
        updatedBy: { type: string }
        version: { type: integer, format: int64 }
    AdminUserSummary:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        fullName: { type: string }
        employeeCode: { type: string }
        status: { $ref: '#/components/schemas/UserStatus' }
        roles: { type: array, items: { type: string } }
        grantCount: { type: integer }
        loginLinked: { type: boolean }
        updatedDate: { type: string, format: date-time }
    AdminUserPage:
      type: object
      properties:
        content: { type: array, items: { $ref: '#/components/schemas/AdminUserSummary' } }
        page: { type: integer }
        size: { type: integer }
        totalElements: { type: integer, format: int64 }
        totalPages: { type: integer }
    DataScope:
      type: object
      properties:
        level: { $ref: '#/components/schemas/ScopeLevel' }
        userId: { type: string }
        teamUserIds: { type: array, items: { type: string } }
        lobs: { type: array, items: { type: string } }
        locations: { type: array, items: { type: string } }
        sharedObjects:
          type: object
          description: Records shared through an approved override, by object type (tracker #6 / #8). Empty until then.
          additionalProperties: { type: array, items: { type: string } }
    EffectiveAccess:
      type: object
      properties:
        userId: { type: string }
        adminUserId: { type: string, format: uuid }
        email: { type: string }
        active: { type: boolean }
        configured: { type: boolean, description: 'false = no admin record, fallback role of the userType' }
        roles: { type: array, items: { type: string } }
        permissions: { type: array, items: { type: string } }
        conditionalPermissions: { type: array, items: { type: string } }
        scope: { $ref: '#/components/schemas/DataScope' }
    EffectiveAccessDetail:
      type: object
      properties:
        access: { $ref: '#/components/schemas/EffectiveAccess' }
        lines:
          type: array
          items:
            type: object
            properties:
              permission: { type: string }
              module: { type: string }
              state: { type: string, enum: [GRANTED, CONDITIONAL, DENIED] }
              sources: { type: array, items: { type: string } }
    PermissionItem:
      type: object
      required: [code]
      properties:
        code: { type: string }
        conditional: { type: boolean, default: false }
    RoleView:
      type: object
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        legacyCode: { type: string }
        name: { type: string }
        description: { type: string }
        defaultScope: { $ref: '#/components/schemas/ScopeLevel' }
        systemRole: { type: boolean }
        active: { type: boolean }
        activeUserCount: { type: integer, format: int64 }
        permissions: { type: array, items: { $ref: '#/components/schemas/PermissionItem' } }
        version: { type: integer, format: int64 }
    CreateRoleRequest:
      type: object
      required: [code, name, defaultScope, permissions]
      properties:
        code: { type: string, pattern: '^[A-Z][A-Z0-9_]{1,49}$' }
        name: { type: string, maxLength: 100 }
        description: { type: string, maxLength: 500 }
        defaultScope: { $ref: '#/components/schemas/ScopeLevel' }
        permissions: { type: array, items: { $ref: '#/components/schemas/PermissionItem' } }
    UpdateRoleRequest:
      type: object
      required: [name, defaultScope, active]
      properties:
        name: { type: string, maxLength: 100 }
        description: { type: string, maxLength: 500 }
        defaultScope: { $ref: '#/components/schemas/ScopeLevel' }
        active: { type: boolean }
        permissions: { type: array, items: { $ref: '#/components/schemas/PermissionItem' }, description: 'Omit to keep current' }
        version: { type: integer, format: int64 }
    PermissionView:
      type: object
      properties:
        code: { type: string }
        objectType: { type: string }
        action: { type: string }
        module: { type: string }
        description: { type: string }
        privileged: { type: boolean }
    Matrix:
      type: object
      properties:
        roles: { type: array, items: { $ref: '#/components/schemas/RoleView' } }
        permissions: { type: array, items: { $ref: '#/components/schemas/PermissionView' } }
        grants:
          type: object
          additionalProperties:
            type: object
            additionalProperties: { type: string, enum: [A, C] }
    MatrixUpdate:
      type: object
      required: [grants]
      properties:
        grants:
          type: object
          additionalProperties:
            type: array
            items: { $ref: '#/components/schemas/PermissionItem' }
    Me:
      type: object
      properties:
        userId: { type: string }
        email: { type: string }
        name: { type: string }
        userType: { type: string }
        active: { type: boolean }
        configured: { type: boolean }
        roles: { type: array, items: { type: string } }
        permissions: { type: array, items: { type: string } }
        conditionalPermissions: { type: array, items: { type: string } }
        scope: { $ref: '#/components/schemas/DataScope' }
    CheckRequest:
      type: object
      properties:
        permission: { type: string }
        objectType: { type: string }
        objectId: { type: string }
        ownerId: { type: string }
        assigneeIds: { type: array, items: { type: string } }
        lob: { type: string }
        location: { type: string }
    ConfigValueType: { type: string, enum: [STRING, NUMBER, BOOLEAN, JSON, LIST] }
    ConfigView:
      type: object
      properties:
        key: { type: string }
        value: { type: string, description: Always a string - parse by valueType }
        valueType: { $ref: '#/components/schemas/ConfigValueType' }
        category: { type: string }
        description: { type: string }
        updatedDate: { type: string, format: date-time }
        updatedBy: { type: string }
        version: { type: integer, format: int64 }
    ConfigCreate:
      type: object
      required: [key, value, valueType, category]
      properties:
        key: { type: string, pattern: '^[a-z0-9][a-z0-9.\-]{2,149}$' }
        value: { type: string, maxLength: 10000 }
        valueType: { $ref: '#/components/schemas/ConfigValueType' }
        category: { type: string, pattern: '^[A-Z][A-Z0-9_]{1,59}$' }
        description: { type: string, maxLength: 500 }
    ConfigUpdate:
      type: object
      required: [value]
      properties:
        value: { type: string, maxLength: 10000 }
        description: { type: string, maxLength: 500 }
        version: { type: integer, format: int64 }
    CheckResponse:
      type: object
      properties:
        allowed: { type: boolean }
        reason: { type: string }
